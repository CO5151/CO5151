[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legalpilot-vn"
version = "0.1.0"
description = "Autonomous Multi-Agent RAG for Vietnamese Legal Compliance & Verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dang Lam Tung" },
    { name = "Nguyen Trung Phong" },
    { name = "Vu Viet Hung" }
]
keywords = [
    "multi-agent",
    "rag",
    "vietnamese-legal",
    "google-adk",
    "neo4j",
    "qdrant",
    "compliance"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "google-adk>=2.3.0",
    "google-genai>=2.9.0",
    "google-adk-community>=0.5.0",
    "litellm>=1.50.0",
    "openinference-instrumentation-google-adk>=0.1.6",
    "neo4j>=5.23.0",
    "qdrant-client>=1.11.0",
    "ragas>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "python-docx>=1.1.2",
    "rich>=13.8.0",
    "streamlit>=1.38.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "types-pyyaml>=6.0.12",
    "types-beautifulsoup4>=4.12.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "*.md"
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF"   # ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008"  # do not perform function calls in argument defaults (needed for FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
