name: Docker Build Check

on:
  push:
    branches: [ main, "paul/*" ]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "src/**"
      - "configs/**"
  pull_request:
    branches: [ main ]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "src/**"
      - "configs/**"

jobs:
  build:
    name: Validate Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: legalpilot-vn:test
