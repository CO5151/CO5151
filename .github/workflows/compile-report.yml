name: Compile LaTeX Report

on:
  push:
    branches: [ main, "paul/*" ]
    paths:
      - "CO5151 - Agentic RAG for Vietnamese Legal System/**"
  pull_request:
    branches: [ main ]
    paths:
      - "CO5151 - Agentic RAG for Vietnamese Legal System/**"
  workflow_dispatch:

jobs:
  build-pdf:
    name: Compile Report PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: report.tex
          working_directory: "CO5151 - Agentic RAG for Vietnamese Legal System"
          latexmk_use_xelatex: true

      - name: Upload Compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: co5151-legalpilot-report
          path: "CO5151 - Agentic RAG for Vietnamese Legal System/report.pdf"
